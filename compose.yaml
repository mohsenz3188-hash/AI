name: nava-ai
services:
  app:
    build: .
    restart: unless-stopped
    init: true
    environment:
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?Run the setup first}
      APP_ORIGINS: ${APP_ORIGINS:?Set the public address}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CHAT_MODELS: ${CHAT_MODELS:-gpt-4.1-mini,gpt-4.1}
      IMAGE_BASE_URL: ${IMAGE_BASE_URL:-https://api.openai.com/v1}
      IMAGE_API_KEY: ${IMAGE_API_KEY:-}
      IMAGE_MODEL: ${IMAGE_MODEL:-gpt-image-1}
      MAX_OUTPUT_TOKENS: ${MAX_OUTPUT_TOKENS:-4096}
    volumes:
      - app_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 768m
    cpus: 1.5
    pids_limit: 128
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-http://:80}
      NO_PROXY: app,localhost,127.0.0.1
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
volumes:
  app_data:
  caddy_data:
  caddy_config:
